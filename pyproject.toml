[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xvc2-large-streaming-codec"
version = "0.1.0"
description = "Large continuous streaming codec for X-VC2"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "torch>=2.4", "torchaudio>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
xvc2-codec-train = "xvc2_codec.train:main"
xvc2-codec-smoke = "xvc2_codec.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
