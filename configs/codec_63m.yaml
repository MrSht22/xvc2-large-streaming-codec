schema_version: 1
model:
  student_dim: 768
  vocab_size: 40
  keep_trunk_dim: 512
  inv_dim: 128
  dyn_dim: 32
  edit_dim: 96
  encoder_channels: 48
  encoder_rates: [2, 4, 5, 8]
  inv_projection_dim: 128
  dyn_projection_dim: 64
  edit_projection_dim: 128
  fusion_channels: 640
  fusion_kernel_size: 7
  fusion_dilations: [1, 3, 9, 1]
  decoder_rates: [8, 5, 4, 2]
  decoder_channels: [768, 512, 384, 256]
  residual_kernels: [3, 7, 11]
  residual_dilations: [1, 3, 5]
  dropout: 0.1
discriminator:
  fft_sizes: [256, 512, 1024]
  base_channels: 16
  maximum_channels: 128
schedule:
  reconstruction_end: 10000
  gan_ramp_end: 30000
  sa_ramp_end: 60000
  max_steps: 300000
loss:
  reconstruction: 1.0
  adversarial: 0.1
  feature_matching: 1.0
  edit_style: 0.5
  sa_inv: 1.0
  sa_dyn: 0.05
  phone_anchor: 0.25
  dyn_anchor: 0.25
  prosody_anchor: 0.1
training:
  generator_learning_rate: 0.0001
  discriminator_learning_rate: 0.0002
  weight_decay: 0.0001
  gradient_clip: 5.0
  amp: bf16
  ema_decay: 0.999
  seed: 1
  log_interval: 20
  save_interval: 10000

